<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketchbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
  :root { --paper:#fbf8f2; --ink:#141210; --muted:#77706a; --line:#e3ddd2; --blue:#3b7dd8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; height: 100vh; }
  aside { padding: 22px 18px; overflow-y: auto; border-right: 1px solid var(--line); }
  h1 { font: 22px Silkscreen, monospace; margin: 0 0 4px; }
  h2 { font: 12px Silkscreen, monospace; color: var(--muted); margin: 24px 0 8px; letter-spacing: .04em; }
  .sub { margin: 0; color: var(--muted); }
  a.back { color: var(--muted); text-decoration: none; font-size: 13px; display: block; margin-bottom: 14px; }
  button.ep { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  button.ep:hover { border-color: var(--ink); }
  button.ep[aria-pressed=true] { border-color: var(--blue); }
  button.ep:focus-visible, select:focus-visible, .go:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  button.ep b { display: block; font: 13px Silkscreen, monospace; }
  button.ep span { color: var(--muted); font-size: 13px; }
  .try { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
  select, .go { font: inherit; border: 2px solid var(--ink); background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 10px; min-width: 0; }
  .go { background: var(--ink); color: #fff; cursor: pointer; }
  main { position: relative; min-width: 0; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; grid-template-rows: auto 72vh; height: auto; } aside { border-right: 0; border-bottom: 1px solid var(--line); } main { height: 72vh; } }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <a class="back" href="../index.html">&larr; All shorts</a>
    <h1>Sketchbook</h1>
    <p class="sub">The art-style seasons. Seasons 10 and 11 open on the hook.</p>
    <div id="eps"></div>
    <h2>Try a look on any episode</h2>
    <div class="try">
      <select id="ep" aria-label="Episode"></select>
      <select id="look" aria-label="Look">
        <option value="charcoal">Charcoal</option><option value="pencil">Coloured pencil</option><option value="crayon">Crayon</option><option value="graphite">Graphite</option><option value="riso">Riso</option>
      </select>
      <button class="go" id="go">Play</button>
    </div>
  </aside>
  <main><iframe id="view" title="Episode player" allow="autoplay"></iframe></main>
</div>
<script>
  const GROUPS = [
    ['Season 12 · send this', [['the-beep', 'The Beep', 'A clock on screen, cut like a bomb film'], ['on-my-way', 'On My Way', 'Cuts between two places'], ['not-hungry', 'Not Hungry', 'The result first'], ['missed-the-bus', 'Missed the Bus', 'The second it is lost'], ['sit-up', 'Sit Up', 'Wobbin talks to you']]],
    ['Season 11 · colour in', [['small-wins', 'Small Wins', 'A foot of colour, one win at a time'], ['say-hi', 'Say Hi', 'A silent bus'], ['dance-break', 'Dance Break', 'Colour that snaps back'], ['scribble', 'Scribble', 'One flower on a grey wall'], ['call-mum', 'Call Mum', '4 missed calls']]],
    ['Season 10 · errands', [['one-trip', 'One Trip', 'Ten bags, one head'], ['hiding', 'Hiding', 'Someone you know'], ['the-angle', 'The Angle', 'The charger'], ['the-mosquito', 'The Mosquito', '3 am'], ['payday', 'Payday', 'Coins on little legs']]],
    ['Season 9 · sketchbook', [['new-pencil', 'New Pencil', 'Every look in turn'], ['power-cut', 'Power Cut', 'Charcoal + chalk'], ['the-menu', 'The Menu', 'Pen + coloured pencil'], ['puddles', 'Puddles', 'Graphite into crayon']]],
  ];
  const OLD = ['the-gap', 'rain-check', 'yes', 'last-minute', 'perfect', 'seen', 'what-if', 'battery', 'bloom', 'comfort-zone', 'cant-sleep', 'the-chair', 'water-yourself', 'small-talk'];
  const view = document.getElementById('view'), eps = document.getElementById('eps'), ep = document.getElementById('ep');
  const pick = id => { view.src = '../' + id + '.html'; for (const b of eps.querySelectorAll('.ep')) b.setAttribute('aria-pressed', b.dataset.id === id); };
  for (const [title, list] of GROUPS) {
    const h = document.createElement('h2'); h.textContent = title; eps.appendChild(h);
    for (const [id, name, look] of list) {
      const b = document.createElement('button'); b.className = 'ep'; b.dataset.id = id; b.innerHTML = `<b>${name}</b><span>${look}</span>`;
      b.onclick = () => pick(id); eps.appendChild(b);
    }
  }
  for (const id of OLD) { const o = document.createElement('option'); o.value = id; o.textContent = id.replace(/-/g, ' '); ep.appendChild(o); }
  document.getElementById('go').onclick = () => { view.src = `../${ep.value}.html?style=${document.getElementById('look').value}`; for (const b of eps.querySelectorAll('.ep')) b.setAttribute('aria-pressed', false); };
  pick('one-trip');
</script>
</body>
</html>
