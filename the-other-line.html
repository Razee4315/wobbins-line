<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Other Line</title>
</head>
<body>
<script src="sfx.js?v=11"></script>
<script src="engine2.js?v=11"></script>
<script>
// Bo joins the back of a line without knowing what it's for. The camera pulls back: two
// ice-cream carts, two lines. Bo's line stops, the other one flies. Bo switches. It stops.
// Bo switches back. It stops. So Bo sits down and waits, watches the light change, and
// suddenly it's Bo's turn: the biggest cone of the day.
// Button: on the bench a kid stops and stares up at Bo's giant cone. Bo looks at the kid, at the
// cone... and the top scoops hop over onto the kid's head. They eat together, then skip off.
const { PAL, SPRITES, sprite, butterfly, cloud, lerp, seg, sine, outBack, clamp, hash, spring, mix, GROUND } = Shorts;
// people in a line stand 178 apart (bodies are ~160 wide), and the carts are far enough apart that the two
// lines never meet. The vendors are drawn behind their counters, so walking past a cart is just a prop.
const V = 170, A_X = 2050, B_X = 700, GAP = 178;
const slotA = k => A_X - 120 - k * GAP, slotB = k => B_X + 120 + k * GAP;
const CONE = ['.SSS.', 'SSSSS', 'SSSSS', 'BBBBB', '.BWB.', '.BBB.', '..B..'];
const MEGA = ['..R..', '.TTT.', 'TTTTT', '.YYY.', 'YYYYY', '.PPP.', 'PPPPP', 'BBBBB', '.BWB.', '.BBB.', '..B..'];
const SCOOPS = [PAL.pink, PAL.yellow, PAL.sky, PAL.lime, '#ffffff', PAL.orange];
const LOOKS = [
  { hair: 'curl', blush: PAL.pink, fill: '#ffe9f2' }, { hair: 'antenna', hairColor: PAL.blue, fill: '#e6f0ff' },
  { hairColor: PAL.orange, blush: '#ffb08a', fill: '#fff4d6' }, { hair: 'curl', hairColor: PAL.green, fill: '#e3fbef' },
  { hair: 'antenna', hairColor: PAL.red, fill: '#ffe8e8' }, { hairColor: PAL.violet, fill: '#efeaff' },
  { hair: 'curl', hairColor: PAL.sky, fill: '#e2f6ff' }, { hairColor: PAL.brown, blush: PAL.pink, fill: '#fff0e0' },
];
// queue events: [time, line, what]
const SERVE = [
  [11.4, 'B'],                                     // Bo's line is stuck, the other one moves
  [15.9, 'A'], [16.9, 'A'],                        // Bo switches: now the old line flies
  [19.6, 'B'],                                     // switches back: the other one empties
  [26.2, 'A'],                                     // Bo waits it out
];
const STALL_B = [15.4, 19.3], STALL_A = [18.6, 25.8];
const BO_TURN = 27.6, BENCH = A_X + 330, KID = BENCH + 182, SHARE = 35.9, LEAVE = 38.9, LOOP = LEAVE + 6.8;
// eating, in rows bitten off the top: Bo's giant cone (after the top 5 rows hop to the kid) and the kid's share
const boCut = t => t < SHARE ? 0 : t < 36.9 ? 5 : t < 37.5 ? 7 : MEGA.length, kidCut = t => t < 37.15 ? 0 : t < 37.7 ? 2 : 5;

function teleport(c, x) {
  const dx = x - c.x; c.x += dx; c.hx += dx; c.vx = 0; c.cmd.x = x;
  if (c.tuft) c.tuft.x += dx;
  for (const F of c.feet) { F.x += dx; F.fromX += dx; F.toX += dx; }
}

Shorts.play({
  title: 'The Other Line',
  accent: PAL.orange,
  voice: { pitch: 1 },
  loopAfter: LOOP,
  paperAt: t => mix('#ffffff', '#fff1dc', sine(seg(t, 22.5, 25.5)) * (1 - sine(seg(t, 29, 33)))),
  captions: [
    [9.6, 11.0, '*ice cream!*'],
    [12.6, 14.2, 'that line is *faster.*'],
    [16.3, 17.8, 'oh, *come on.*'],
    [19.8, 21.2, '*what?!*'],
    [22.6, 24.2, "fine. *i'll wait.*"],
    [28.0, 29.4, 'oh! *my turn.*'],
    [30.2, 34.4, 'the other line always looks faster. *yours is moving too.*'],
    [34.5, 35.4, '*whoa...*', null, { pitch: 1.4 }],
    [36.5, 37.2, '*yay!*', null, { pitch: 1.4 }],
  ],
  init(S) {
    S.A = []; S.B = []; S.gone = [];
    for (let i = 0; i < 3; i++) S.A.push(S.addChar({ x: slotA(i), face: 1, gain: .3, ...LOOKS[i] }));
    // line B's two customers step into place out of shot, once Bo has walked past (so Bo never walks through them)
    S.Bwait = [0, 1].map(i => { const m = S.addChar({ x: -3000 - i * 300, face: -1, gain: .3, ...LOOKS[4 + i] }); m.hidden = true; return m; });
    S.bo = S.addChar({ x: 0, walk: V }); S.focus = S.bo;
    S.kid = S.addChar({ x: 2860, face: -1, gain: .3, hair: 'antenna', hairColor: PAL.lime, blush: PAL.pink, fill: '#f4ffe0' });
    S.in = null; S.served = 0; S.mega = 0; S.bites = 0; S.fly = 0; S.hum = 0;
    S.A.forEach((c, i) => c.cone = null); S.B.forEach(c => c.cone = null);
  },
  update(S, t, dt) {
    const bo = S.bo, c = bo.cmd;
    // everyone in a line shuffles to their slot; Bo too, once Bo is in one
    const place = (q, slot, dir) => q.forEach((m, k) => { if (m === bo) return; Object.assign(m.cmd, { x: slot(k), speed: 120, accel: 500, face: dir }); });
    if (t > 8.2) S.once('lineB', () => S.Bwait.forEach((m, i) => { teleport(m, slotB(i)); m.hidden = false; S.B.push(m); }));
    place(S.A, slotA, 1); place(S.B, slotB, -1);
    const serve = (name) => {
      const q = name === 'A' ? S.A : S.B, m = q[0]; if (!m || m === bo) return;
      q.shift(); m.cone = SCOOPS[S.served++ % SCOOPS.length]; m.coneAt = t;
      Object.assign(m.cmd, { x: name === 'A' ? 6000 : -4000, speed: 260, accel: 600, face: name === 'A' ? 1 : -1, eye: 'happy' });
      S.sfx('catch', { pitch: 520 + hash(S.served) * 200 }, m.x); S.sfx('laugh', { k: .9 + hash(S.served) * .4, n: 2, g: .6 }, m.x);
      m.jump(0, -300); S.gone.push(m);
    };
    SERVE.forEach(([at, q], i) => { if (t >= at) S.once('serve' + i, () => serve(q)); });

    const joinA = () => { S.B = S.B.filter(m => m !== bo); S.in = 'A'; S.A.push(bo); };
    const joinB = () => { S.A = S.A.filter(m => m !== bo); S.in = 'B'; S.B.push(bo); };
    S.plan(bo, t, [
      [0, { x: slotA(3), speed: V, accel: 520 }],
      [8.2, () => joinA()],
      [8.6, { lookX: .6, lookY: -.2, tilt: .14 }],                     // peeks round the person in front
      [9.4, { tilt: 0, eye: 'happy', lookX: .4 }], [9.4, () => { bo.jump(0, -360); S.sfx('twinkle', { pitch: 1568 }, A_X); }],
      [10.6, { eye: 'open', lookX: 0 }],
      [12.0, { face: -1, lookX: .6 }], [12.0, () => S.sfx('slip', {}, bo.x)],
      [13.4, { face: 1, lookX: 0 }], [13.8, { face: -1, eye: 'squeeze' }],
      [14.4, () => joinB()],                                          // switch!
      [14.4, { eye: 'open' }], [14.4, () => S.sfx('whoosh', { d: .5 }, bo.x)],
      [15.5, { eye: 'flat' }],
      [16.0, { face: 1, lookX: .5 }],
      [17.9, () => joinA()], [17.9, () => S.sfx('whoosh', { d: .5 }, bo.x)],   // switch back
      [18.0, { eye: 'squeeze' }], [19.0, { eye: 'open' }],
      [19.7, { face: -1, eye: 'wide' }], [20.2, { crouch: .2 }], [20.45, { crouch: 0 }], [20.45, () => { bo.jump(0, -520); S.sfx('dizzy', {}, bo.x); }],
      [21.2, { face: 1, eye: 'dizzy' }], [21.9, { eye: 'flat' }],
      [22.3, { sit: 1, tilt: .08, eye: 'flat' }], [22.3, () => S.sfx('breathOut', { d: 1.3 }, bo.x)],   // fine. I'll wait.
      [24.0, { eye: 'open', lookY: -.8, lookX: .2, tilt: -.06 }],      // watches the sky instead
      [24.2, () => S.sfx('hum', { notes: [2, 4, 5, 4, 2, 1, 2], gap: .34 }, bo.x)],
      [25.6, { eye: 'happy' }],
      [27.3, { sit: 0, tilt: 0, lookY: 0, eye: 'open' }],
      [BO_TURN, { eye: 'wide' }],
      [BO_TURN + .3, () => { S.mega = t; S.sfx('arp', { notes: [0, 2, 4, 7, 9] }); S.sfx('sparkle', { n: 9 }, A_X); }],
      [BO_TURN + .5, { eye: 'happy' }], [BO_TURN + .8, { crouch: .2 }], [BO_TURN + 1.05, { crouch: 0 }], [BO_TURN + 1.05, () => bo.jump(0, -520)],
      [29.8, () => { S.A = S.A.filter(m => m !== bo); S.in = null; }],
      [29.8, { x: BENCH, speed: 110, accel: 400, eye: 'open' }],
      [31.0, { sit: 1, eye: 'happy', lookX: .3, lookY: -.4 }],
      [34.6, { eye: 'open', lookX: .8, lookY: 0 }],                         // someone's staring
      [35.1, { lookX: .2, lookY: -1 }],                                     // at the cone...
      [35.5, { lookX: .8, lookY: 0, eye: 'happy' }],
      [SHARE, () => { bo.q.v -= 2.5; S.sfx('toss', { pitch: 420 }, bo.x); S.sfx('whoosh', { d: .4, v: .4 }, bo.x); }],   // here!
      [37.9, { sit: 0, eye: 'happy', lookX: 0, lookY: 0 }],
      [38.2, { crouch: .2 }], [38.45, { crouch: 0 }], [38.45, () => bo.jump(0, -460)],
      [LEAVE, { x: 1e6, speed: V, accel: 450, eye: 'open' }],
      [LEAVE + .1, () => S.sfx('hum', { notes: [2, 4, 5, 7, 5], gap: .3, g: .04 }, bo.x)],
    ]);
    // the kid: strolls up, stares at the giant cone, gets the top scoops, eats, and skips off ahead
    const kid = S.kid;
    S.plan(kid, t, [
      [31.2, { x: KID, speed: 190, accel: 420, face: -1 }],
      [33.9, { eye: 'wide', lookX: .4, lookY: -1, tilt: .08 }],
      [SHARE + .3, { lookY: -1, lookX: 0, tilt: 0 }],
      [SHARE + .5, { eye: 'heart' }], [SHARE + .55, () => { kid.jump(0, -340); S.sfx('catch', { pitch: 640 }, kid.x); S.sfx('sparkle', { n: 5 }, kid.x); }],
      [36.9, { eye: 'happy', lookY: 0 }],
      [37.8, { face: 1, x: 1e6, speed: 2 * V, accel: 800 }],
    ]);
    if (t > 38.3 && kid.mode === 'ground' && hash(Math.floor(t * 2.5)) > .7) S.once(`skip:${Math.floor(t * 2.5)}`, () => kid.jump(kid.vx, -300));
    // bites: a crumb burst and a happy munch each time either cone gets smaller
    [[36.9, bo], [37.15, kid], [37.5, bo], [37.7, kid]].forEach(([at, m], i) => {
      if (t >= at) S.once('bite' + i, () => { S.sfx('catch', { pitch: 380 + i * 40 }, m.x); S.sfx('laugh', { k: m === bo ? 1.15 : 1.4, n: 1, g: .5 }, m.x); m.q.v -= 1.2; S.burst(m.x + 10 * m.dir, m.top().y - 30, 5, [SCOOPS[i % 6], '#fff'], { speed: 160, gravity: 600, size: 6, life: .6 }); });
    });
    // Bo's place in whichever line Bo is in
    if (S.in) {
      const q = S.in === 'A' ? S.A : S.B, k = q.indexOf(bo), x = t > 22.3 && t < 27.3 ? c.x : S.in === 'A' ? slotA(k) : slotB(k);
      Object.assign(c, { x, speed: Math.abs(bo.x - x) > 150 ? 330 : 120, accel: 1100 });
      if (Math.abs(bo.x - x) > 150) c.face = Math.sign(x - bo.x); else if (t > 14.6 && t < 17.8) c.face = S.in === 'B' ? -1 : 1;
    }
    // Bo's turn: the person ahead gets served at 26.2, then Bo steps up
    // stalls: the cart shows a little "!" (B's machine sputters, A's vendor takes a call)
    if (t > STALL_B[0]) S.once('stallB', () => { S.sfx('drain', {}, B_X); S.sfx('poof', {}, B_X); });
    if (t > STALL_A[0]) S.once('stallA', () => S.sfx('ring', {}, A_X));
    if (t > STALL_A[0] + 1.4) S.once('stallA2', () => S.sfx('ring', {}, A_X));
    // a butterfly keeps Bo company while Bo waits
    if (t > 23.6 && t < 28) { S.fly += dt; if (S.fly > .32) { S.fly = 0; S.sfx('flap', {}); } }
    // ambience: a warm afternoon
    S.once('amb', () => { S.sfx('birds', { d: LOOP, g: .8 }); S.sfx('room', { d: LOOP, g: .5 }); });

    // camera: tight on Bo walking in (what is this line?), then pull back to show both carts
    // then follow the action like a camera operator: whichever line is moving, plus Bo
    const shot = (x, z, k = 1.6) => { S.camGoal.x = x; S.camGoal.z = z; S.camGoal.kx = k; S.camGoal.kz = k * .8; };
    if (t < 9.0) { S.camGoal.z = 1.2; S.camGoal.kz = 2; }
    else if (t < 11.0) shot((A_X + B_X) / 2, .42, 3.2);                 // the reveal: two carts, two lines
    else if (t < 14.4) shot((B_X + bo.x) / 2 + 20, .7);                  // Bo, watching the other line fly
    else if (t < 17.9) shot((bo.x + A_X) / 2 + 20, .64);                 // now the old line flies
    else if (t < 22.2) shot((B_X + bo.x) / 2, .64);                      // ...and the other one empties
    else if (t < 27.3) shot(bo.x + 40, 1.0, 1.2);                        // waiting, close and quiet
    else if (t < 29.6) shot((bo.x + A_X) / 2, 1.0);
    else if (t < 33.2) shot((bo.x + A_X) / 2, .95);
    else if (t < LEAVE) shot((BENCH + KID) / 2 + 10, 1.05);                // the kid, the cone, the share
  },
  drawSky(S, ctx, t, v) {
    for (let i = 0; i < 3; i++) {
      const W = v.right - v.left + 400, x = v.left - 200 + (1 - ((t / S.T + i / 3 + .2) % 1)) * W;
      cloud(ctx, x, v.top + (v.bottom - v.top) * (.2 + i * .07), 9, { X: mix('#ebe8f4', '#ffe0c0', sine(seg(t, 22.5, 25.5)) * (1 - sine(seg(t, 29, 33)))) });
    }
  },
  drawBack(S, ctx, t) {
    // the bench by cart A
    ctx.fillStyle = PAL.brown; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.roundRect(BENCH - 80, GROUND - 52, 160, 16, 6); ctx.fill(); ctx.stroke();
    for (const x of [BENCH - 62, BENCH + 62]) { ctx.beginPath(); ctx.moveTo(x, GROUND - 36); ctx.lineTo(x, GROUND + 2); ctx.stroke(); }
  },
  drawFront(S, ctx, t) {
    const cart = (x, dir, stripe, body, stall, vend, hairKind, hairCol) => {
      const J = i => S.J(i + x);
      // awning on two poles
      ctx.lineWidth = 5; ctx.strokeStyle = '#111';
      for (const px of [x - 58, x + 58]) { ctx.beginPath(); ctx.moveTo(px, GROUND - 100); ctx.lineTo(px + J(1) * .3, GROUND - 230); ctx.stroke(); }
      for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? '#fff' : stripe; ctx.fillRect(x - 78 + i * 26, GROUND - 262, 26, 34); }
      ctx.strokeRect(x - 78, GROUND - 262, 156, 34);
      for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? '#fff' : stripe; ctx.beginPath(); ctx.arc(x - 65 + i * 26, GROUND - 228, 13, 0, Math.PI); ctx.fill(); }
      // the vendor, behind the counter: a round head, one eye, a bob on every serve
      const vx = x - dir * 6, vy = GROUND - 132 + Math.sin(t * 2.2 + x) * 2, eye = vend;
      ctx.fillStyle = '#fff'; ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(vx + J(3) * .3, vy, 48, 42, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 4.5;
      if (hairKind === 'antenna') { ctx.strokeStyle = hairCol; ctx.beginPath(); ctx.moveTo(vx - dir * 8, vy - 40); ctx.quadraticCurveTo(vx - dir * 14, vy - 60, vx - dir * 6, vy - 72); ctx.stroke(); ctx.fillStyle = hairCol; ctx.beginPath(); ctx.arc(vx - dir * 6, vy - 72, 7, 0, Math.PI * 2); ctx.fill(); }
      else { ctx.strokeStyle = hairCol; for (const a of [-.4, 0, .4]) { ctx.beginPath(); ctx.moveTo(vx - dir * 8, vy - 40); ctx.lineTo(vx - dir * 8 + Math.sin(a - dir * .4) * 26, vy - 40 - Math.cos(a) * 24); ctx.stroke(); } }
      ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
      const ex = vx + dir * 22, ey = vy - 8;
      if (eye === 'happy') { ctx.beginPath(); ctx.arc(ex, ey + 6, 9, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
      else { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex + dir * 2, ey + (eye === 'flat' ? 4 : 1), 4, 0, Math.PI * 2); ctx.fill();
        if (eye === 'flat' || eye === 'sad') { ctx.fillStyle = '#fff'; ctx.fillRect(ex - 12, ey - 12, 24, eye === 'flat' ? 11 : 8); ctx.beginPath(); ctx.moveTo(ex - 11, ey - (eye === 'flat' ? 1 : 4)); ctx.lineTo(ex + 11, ey - (eye === 'flat' ? 1 : 4)); ctx.stroke(); } }
      ctx.strokeStyle = '#111';
      // the cart body hides the vendor's legs
      ctx.fillStyle = body; ctx.beginPath(); ctx.roundRect(x - 74 + J(2) * .3, GROUND - 112, 148, 86, 10); ctx.fill(); ctx.stroke();
      sprite(ctx, CONE, x, GROUND - 70, 6, { S: stripe, B: PAL.orange, W: PAL.peach });
      for (const wx of [x - 44, x + 44]) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(wx, GROUND - 16, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
      if (stall) { const k = outBack(clamp((t - stall) / .3)); sprite(ctx, SPRITES.bang, x + dir * 10, GROUND - 300 + Math.sin(t * 8) * 3, 6 * k, { X: PAL.red }); }
    };
    const stA = t > STALL_A[0] && t < STALL_A[1], stB = t > STALL_B[0] && t < STALL_B[1];
    cart(A_X, -1, PAL.red, PAL.peach, stA ? STALL_A[0] : 0, stA ? 'flat' : 'happy', 'antenna', PAL.red);
    cart(B_X, 1, PAL.sky, PAL.lav, stB ? STALL_B[0] : 0, stB ? 'sad' : 'happy', 'tuft', PAL.sky);
    // the phone A's vendor is busy on
    if (t > STALL_A[0] && t < STALL_A[1]) sprite(ctx, ['XXX', 'XBX', 'XBX', 'XXX'], A_X - 52, GROUND - 140, 5, { X: '#111', B: PAL.sky });
    // B's machine puffs a little smoke while it's broken
    if (t > STALL_B[0] && t < STALL_B[1]) for (let i = 0; i < 4; i++) { const u = ((t - STALL_B[0]) * .8 + i / 4) % 1; ctx.fillStyle = PAL.grey; ctx.globalAlpha = 1 - u; ctx.beginPath(); ctx.arc(B_X + 30 + u * 20, GROUND - 130 - u * 90, 10 + u * 12, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
    // cones ride on heads (nobody here has hands)
    for (const m of S.gone) { const top = m.top(), k = outBack(clamp((t - m.coneAt) / .3)); sprite(ctx, CONE, top.x, top.y - 24, 4.4 * k, { S: m.cone, B: PAL.orange, W: PAL.peach }); }
    const MC = { R: PAL.red, T: PAL.sky, Y: PAL.yellow, P: PAL.pink, S: PAL.pink, B: PAL.orange, W: PAL.peach };
    if (S.mega) {
      const top = S.bo.top(), k = outBack(clamp((t - S.mega) / .4)), rows = MEGA.slice(boCut(t));
      if (rows.length) sprite(ctx, rows, top.x, top.y - rows.length * 2.4 - 8, 4.8 * k, MC);
      // the top scoops hop over to the kid, then ride on the kid's head
      const share = MEGA.slice(0, 5), u = seg(t, SHARE, SHARE + .5), kt = S.kid.top();
      if (t > SHARE && t < SHARE + .5) {
        const e = sine(u), x = lerp(top.x, kt.x, e), y = lerp(top.y - 8 - MEGA.length * 4.8 + 12, kt.y - 20, e) - Math.sin(Math.PI * u) * 110;
        sprite(ctx, share, x, y, 4.8, MC);
      } else if (t >= SHARE + .5) {
        const kr = share.slice(kidCut(t));
        if (kr.length) sprite(ctx, kr, kt.x, kt.y - kr.length * 2.4 - 8, 4.8, MC);
      }
    }
    // the butterfly
    if (t > 23.6 && t < 28.4) {
      const top = S.bo.top(), u = t - 23.6, x = top.x + Math.cos(u * 1.3) * 90 + 20, y = top.y - 70 + Math.sin(u * 2.1) * 40;
      butterfly(ctx, x, y, 4.4, { X: PAL.violet }, seg(t, 23.6, 24) * (1 - seg(t, 28, 28.4)), 10);
    }
  },
});
</script>
</body>
</html>
